  <title>网站维护中 — VIRTURA</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0b0b; --fg: #f3f3ef; --muted: #a3a39d; --line: #30302e; --gutter: clamp(24px, 5vw, 72px); }
    * { box-sizing: border-box; }
    html { background: var(--bg); color: var(--fg); }
    html[data-lang="zh"] .lang-en, html[data-lang="en"] .lang-zh { display: none; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; font: 16px/1.7 Arial, Helvetica, "PingFang SC", "Microsoft YaHei", sans-serif; }
    header, footer { padding: 24px var(--gutter); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .logo { display: block; width: clamp(118px, 15vw, 172px); height: auto; }
    .languages { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .languages button { min-width: 44px; min-height: 44px; padding: 8px; border: 0; color: var(--muted); background: none; font: inherit; cursor: pointer; }
    .languages button[aria-pressed="true"] { color: var(--fg); }
    .languages button:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
    .languages span { color: #565653; }
    main { width: 100%; max-width: 1240px; margin: auto; padding: 64px var(--gutter) 88px; }
    .eyebrow { margin: 0 0 28px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    h1 { margin: 0; max-width: 15ch; font-size: clamp(38px, 6.2vw, 80px); font-weight: 400; line-height: 1.18; letter-spacing: -.045em; text-wrap: balance; }
    .message { margin: 32px 0 0; max-width: 37em; color: #bdbdb7; font-size: clamp(15px, 1.5vw, 18px); line-height: 1.9; }
    footer { display: flex; justify-content: space-between; gap: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .04em; }
    @media (max-width: 520px) { header, footer { padding-block: 20px; } main { padding-block: 56px 80px; } .eyebrow { margin-bottom: 22px; } .message { margin-top: 26px; max-width: 25em; } footer { flex-wrap: wrap; gap: 6px 20px; } }

  <main>
    <p class="eyebrow">VIRTURA · WEBSITE</p>
    <h1><span class="lang-zh">网站维护中。</span><span class="lang-en">Under maintenance.</span></h1>
    <p class="message"><span class="lang-zh">本轮更新预计持续约一个月，重新开放时间将另行公布。</span><span class="lang-en">This update is expected to take about one month. We will announce the reopening date separately.</span></p>
  </main>
  <footer><span>VIRTURA © 2026</span><span><span class="lang-zh">感谢你的耐心。</span><span class="lang-en">Thank you for your patience.</span></span></footer>
  <script>
    (() => {
      const root = document.documentElement;
      const buttons = document.querySelectorAll('[data-language]');
      function selectLanguage(value) {
        const lang = value === 'en' ? 'en' : 'zh';
        root.dataset.lang = lang;
        root.lang = lang === 'en' ? 'en' : 'zh-CN';
        document.title = lang === 'en' ? 'Under maintenance — VIRTURA' : '网站维护中 — VIRTURA';
        document.querySelector('meta[name="description"]').content = lang === 'en'
          ? 'The VIRTURA website is being updated. We will announce the reopening date separately.'
          : 'VIRTURA 网站正在维护升级。重新开放时间将另行公布。';
        buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.language === lang)));
        try { localStorage.setItem('virtura-language', lang); } catch (_) {}
      }
      let stored = 'zh';
      try { stored = localStorage.getItem('virtura-language') || 'zh'; } catch (_) {}
      selectLanguage(stored);
      buttons.forEach(button => button.addEventListener('click', () => selectLanguage(button.dataset.language)));
    })();
  </script>
