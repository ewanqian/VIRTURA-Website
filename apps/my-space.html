<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b17"><title>My Space / VIRTURA</title><style>
:root{color-scheme:dark;--bg:#151b17;--fg:#ecf0e9;--sub:#a5b2a7;--line:#415046;--panel:#222c25}*{box-sizing:border-box}body{background:var(--bg);color:var(--fg);margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"PingFang SC",sans-serif}a{color:inherit}button{font:inherit;cursor:pointer;background:#26362c;color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:12px}a:focus-visible,button:focus-visible{outline:2px solid #d4f1d2;outline-offset:3px}.wrap{max-width:920px;margin:auto;padding:42px 22px 100px}.back{font-size:13px;color:#c4ddc3}h1{font-size:clamp(40px,5vw,70px);line-height:1;letter-spacing:-.06em;margin:36px 0 18px;font-weight:520}p{color:var(--sub);max-width:700px}.status{font-size:12px;color:var(--sub);margin:30px 0 12px}.row{display:grid;grid-template-columns:64px 1fr auto;gap:15px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:13px 16px;margin:10px 0;border-radius:14px}.mark{width:58px;height:58px;border-radius:13px;display:grid;place-items:center;background:#395342;border:1px solid #68816c;font-weight:600;letter-spacing:-.05em}.row h2{font-size:18px;font-weight:530;margin:0}.row p{font-size:12px;margin:2px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions a{font-size:12px;text-decoration:none;padding:8px 9px;border:1px solid #749176;border-radius:9px}.foot{margin-top:38px;display:flex;gap:10px;flex-wrap:wrap}.empty{padding:38px;border:1px dashed #617568;border-radius:17px;color:var(--sub)}@media(max-width:650px){.row{grid-template-columns:50px 1fr}.mark{width:48px;height:48px}.actions{grid-column:1/-1}.wrap{padding:25px 16px 60px}}
</style></head><body><main class="wrap"><a class="back" href="store.html">← Spaces Store / 返回应用目录</a><h1>My Space</h1><p>你的个人应用窗口。把常用工具、课程与空间体验保存在这里，并调整顺序。<strong>当前无需登录，收藏仅存在这个浏览器，不会同步到其他设备。</strong></p><div class="status" id="status" aria-live="polite">正在加载…</div><div id="list"></div><div class="foot"><a class="back" href="store.html">添加更多应用 ↗</a><button type="button" id="export">导出我的收藏 JSON</button><button type="button" id="clear">清空本机收藏</button></div><p>导出的 JSON 仅包含应用 ID，不包含账号或私人文件。它不是云同步，也不能用作付费凭证。请勿在此保存密码、Token 或敏感客户资料。</p></main>
<script>
(async()=>{
const STORAGE='virtura.spaces.saved.v1',list=document.getElementById('list'),status=document.getElementById('status');let apps=[];
function read(){try{const v=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(v)?v.filter(x=>typeof x==='string'):[]}catch(_){return []}}
function write(v){try{localStorage.setItem(STORAGE,JSON.stringify(v));return true}catch(_){status.textContent='无法保存：请检查浏览器本地存储权限';return false}}
function draw(){list.replaceChildren();const saved=read().filter(id=>apps.some(a=>a.id===id));status.textContent='已收藏 '+saved.length+' 个应用 · 本地空间';if(!saved.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='这里还没有收藏的应用。前往 Spaces Store，点击「加到我的空间」。';list.append(empty)}
saved.forEach((id,i)=>{const app=apps.find(a=>a.id===id);const row=document.createElement('section');row.className='row';const mark=document.createElement('div');mark.className='mark';mark.textContent=app.mark;const info=document.createElement('div');const name=document.createElement('h2');name.textContent=app.title;const desc=document.createElement('p');desc.textContent=app.summary;info.append(name,desc);
const actions=document.createElement('div');actions.className='actions';const a=document.createElement('a');a.href=app.url;a.textContent='打开 ↗';if(new URL(app.url,location.href).origin!==location.origin)a.target='_blank';a.rel='noopener noreferrer';actions.append(a);
[['↑',i>0,()=>{const xs=read();const n=xs.indexOf(id);if(n>0){[xs[n-1],xs[n]]=[xs[n],xs[n-1]];if(write(xs))draw()}}],['↓',i<saved.length-1,()=>{const xs=read();const n=xs.indexOf(id);if(n>=0&&n<xs.length-1){[xs[n],xs[n+1]]=[xs[n+1],xs[n]];if(write(xs))draw()}}],['移除',true,()=>{if(write(read().filter(x=>x!==id)))draw()}]].forEach(([label,enabled,fn])=>{const b=document.createElement('button');b.textContent=label;b.type='button';b.disabled=!enabled;b.setAttribute('aria-label',label==='移除'?'从我的空间移除 '+app.title:label==='↑'?'上移 '+app.title:'下移 '+app.title);b.addEventListener('click',fn);actions.append(b)});
row.append(mark,info,actions);list.append(row)})}
document.getElementById('clear').addEventListener('click',()=>{if(!read().length)return;if(confirm('确定清空当前浏览器收藏的所有应用？')){if(write([]))draw()}});
document.getElementById('export').addEventListener('click',()=>{const payload=JSON.stringify({schemaVersion:1,exportedAt:new Date().toISOString(),appIds:read()},null,2);const blob=new Blob([payload],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='virtura-my-space.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)});
try{const response=await fetch('store-registry.json',{cache:'no-cache'});if(!response.ok)throw Error(String(response.status));const data=await response.json();apps=data.apps;draw()}catch(_){status.textContent='无法读取应用登记册';list.textContent='请返回 Spaces Store 重试。'}
})();
</script></body></html>
