name: Team biography browser acceptance
on:
  pull_request:
    branches: [main]
    paths: ["index.html", "assets/people/**", "assets/lang.js", "scripts/qa-team*.mjs", ".github/workflows/team-browser-qa.yml"]
  push:
    branches: [main]
    paths: ["index.html", "assets/people/**", "assets/lang.js", "scripts/qa-team*.mjs", ".github/workflows/team-browser-qa.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  team:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      QA_PLAYWRIGHT: /tmp/team-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium
        run: |
          npm install --prefix /tmp/team-browser --no-save --package-lock=false playwright@1.64.1
          /tmp/team-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify local team page
        run: |
          mkdir -p qa-artifacts
          tar -czf qa-artifacts/team-source.tgz index.html assets/lang.js assets/embedded assets/people assets/virtura-logo-white.png
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/team-preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-team-layout.mjs
          node scripts/qa-team.mjs
      - name: Verify actual production on main
        if: github.event_name == 'push'
        env:
          QA_ORIGIN: https://virtura.space
          QA_ARTIFACT_DIR: qa-artifacts/team-live
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail "https://virtura.space/?team-release=$GITHUB_SHA" | grep -q 'Media Art / Interaction Design'; then break; fi
            sleep 5
          done
          node scripts/qa-team.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: team-browser-review
          path: |
            qa-artifacts/
            /tmp/team-preview.log
          if-no-files-found: warn
